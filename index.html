<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curva Redes ABC — M. Ferretti</title>
<style>
:root{
  --bg:#0b1020; --bg2:#0e1630; --card:#141d38; --card2:#1a2647;
  --line:#26325a; --txt:#eaf0ff; --mut:#93a2c9; --mut2:#6c7ba6;
  --acc:#4d7cff; --acc2:#7aa2ff; --brand:#2B2FA8;
  --up:#25d366; --up2:#12351f; --down:#ff5a5f; --down2:#3a1418; --flat:#9aa8cc;
  --gold:#ffcf5c;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  background:radial-gradient(1200px 700px at 80% -10%,#16204a 0%,var(--bg) 55%) fixed;
  color:var(--txt); -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
.wrap{max-width:1500px;margin:0 auto;padding:0 26px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ---------- Topbar ---------- */
.top{display:flex;align-items:center;gap:18px;padding:22px 0 14px}
.top .logo{height:40px}
.top h1{font-size:22px;font-weight:800;letter-spacing:.3px}
.top .sub{color:var(--mut);font-size:13px;font-weight:500;margin-top:2px}
.top .spacer{flex:1}
.up-chip{font-size:12px;color:var(--mut);background:var(--card);border:1px solid var(--line);
  padding:7px 12px;border-radius:999px}

/* ---------- Hub / Curva ABC ---------- */
.hero{padding:14px 0 6px}
.hero h2{font-size:clamp(28px,4vw,46px);font-weight:800;line-height:1.05}
.hero h2 b{color:var(--acc2)}
.hero p{color:var(--mut);font-size:16px;margin-top:10px;max-width:760px}
.search{margin:22px 0 6px;position:relative;max-width:560px}
.search input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);
  font-size:17px;padding:15px 18px 15px 46px;border-radius:14px;outline:none}
.search input:focus{border-color:var(--acc)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.5}

.summary-strip{display:flex;gap:16px;flex-wrap:wrap;margin:18px 0 6px}
.sstat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px;flex:1;min-width:180px}
.sstat .k{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.sstat .v{font-size:26px;font-weight:800;margin-top:6px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;margin:16px 0 60px}
.rede-card{background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);
  border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;
  transition:transform .12s ease,border-color .12s ease;position:relative;overflow:hidden}
.rede-card:hover{transform:translateY(-3px);border-color:var(--acc)}
.rede-card .rank{position:absolute;top:0;right:0;font-size:64px;font-weight:900;color:#ffffff08;line-height:1;padding:8px 16px}
.rede-card .pos{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;
  border-radius:10px;background:var(--acc);color:#fff;font-weight:800;font-size:16px;padding:0 8px}
.rede-card .pos.top{background:linear-gradient(135deg,#ffcf5c,#ff9d3c);color:#2a1a00}
.rede-card h3{font-size:20px;font-weight:800;line-height:1.15}
.rede-card .mm{color:var(--mut);font-size:13px}
.rede-card .mm b{color:var(--txt);font-size:22px;font-weight:800;display:block;margin-top:2px}
.trend{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:15px;padding:6px 12px;border-radius:999px;width:fit-content}
.trend.up{color:var(--up);background:var(--up2)}
.trend.down{color:var(--down);background:var(--down2)}
.trend.flat{color:var(--flat);background:#ffffff10}
.spark{height:44px;width:100%}

/* ---------- Rede view ---------- */
.hidden{display:none!important}
.rv-head{display:flex;align-items:flex-start;gap:18px;padding:20px 0 6px;flex-wrap:wrap}
.back{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 16px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.back:hover{border-color:var(--acc)}
.rv-title{flex:1;min-width:260px}
.rv-title .pos{font-size:13px;color:var(--mut);font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.rv-title h2{font-size:clamp(26px,3.5vw,42px);font-weight:900;line-height:1.05;margin-top:4px}

.kpis{display:flex;gap:16px;flex-wrap:wrap;margin:18px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 22px;flex:1;min-width:190px}
.kpi .k{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.kpi .v{font-size:30px;font-weight:900;margin-top:8px}
.kpi .v.small{font-size:22px}

/* Resumo box */
.resumo{background:linear-gradient(160deg,var(--card2),var(--bg2));border:1px solid var(--line);
  border-left:5px solid var(--acc);border-radius:16px;padding:22px 26px;margin-bottom:8px;font-size:18px;line-height:1.6}
.resumo .big{font-size:22px;font-weight:800;display:block;margin-bottom:10px}
.resumo .hl-up{color:var(--up);font-weight:800}
.resumo .hl-down{color:var(--down);font-weight:800}
.resumo ul{margin:12px 0 0 4px;list-style:none}
.resumo li{padding:6px 0;display:flex;gap:10px;align-items:center;font-size:16px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}

/* Tabs */
.tabs{display:flex;gap:10px;margin:22px 0 18px;flex-wrap:wrap}
.tab{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 22px;font-weight:800;font-size:16px;color:var(--mut)}
.tab.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.tab:hover:not(.active){border-color:var(--acc);color:var(--txt)}

.panel{display:none}
.panel.active{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* item rows (produtos/marcas) */
.rows{display:flex;flex-direction:column;gap:10px;margin-bottom:60px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;
  display:grid;grid-template-columns:38px 1fr 120px 150px 92px;gap:16px;align-items:center;
  transition:border-color .12s}
.row:hover{border-color:var(--acc)}
.row .idx{font-weight:800;color:var(--mut2);text-align:center;font-size:15px}
.row .nm{font-weight:700;font-size:16px;line-height:1.25}
.row .nm small{display:block;color:var(--mut);font-weight:600;font-size:12px;margin-top:2px}
.row .val{font-weight:800;font-size:17px;text-align:right}
.row .val small{display:block;color:var(--mut);font-weight:600;font-size:11px}
.row .mini{height:34px}
.row .tr{justify-self:end}
.tag{display:inline-block;font-size:11px;font-weight:800;color:var(--acc2);background:#4d7cff1a;padding:2px 8px;border-radius:6px;margin-left:6px;vertical-align:middle}

/* mensal chart */
.chartbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:60px}
.chartbox h4{font-size:20px;font-weight:800;margin-bottom:4px}
.chartbox .cs{color:var(--mut);font-size:14px;margin-bottom:18px}
.bars{width:100%;height:min(52vh,440px)}

/* modal-ish detail for product/brand series */
.detail{background:var(--card2);border:1px solid var(--acc);border-radius:16px;padding:20px 24px;margin:6px 0 16px}
.detail .dt{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.detail h5{font-size:19px;font-weight:800}
.detail .close{color:var(--mut);font-weight:800;font-size:22px;line-height:1;padding:4px 8px}

.empty{color:var(--mut);text-align:center;padding:60px 0;font-size:17px}

@media(max-width:640px){
  .row{grid-template-columns:28px 1fr 96px;grid-template-areas:"idx nm val";row-gap:8px}
  .row .mini{grid-column:1/-1;grid-area:mini}
  .row .tr{grid-column:2/-1;justify-self:start}
  .rede-card .rank{font-size:48px}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <img class="logo" src="logo-ferretti.png" alt="Ferretti" onerror="this.style.display='none'">
    <div>
      <h1>Curva Redes ABC</h1>
      <div class="sub">Ranking, evolução e saúde das redes — últimos 12 meses</div>
    </div>
    <div class="spacer"></div>
    <div class="up-chip" id="upChip">—</div>
  </div>

  <!-- ============ HUB ============ -->
  <section id="hub">
    <div class="hero">
      <h2>Suas redes, do <b>1º ao último</b>.</h2>
      <p>Ordenadas pela média de venda mensal. Clique numa rede para ver o que você vende, o que está crescendo, o que está caindo e como ela está de saúde.</p>
    </div>

    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#eaf0ff" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" placeholder="Buscar rede...">
    </div>

    <div class="summary-strip" id="hubStats"></div>
    <div class="grid" id="hubGrid"></div>
  </section>

  <!-- ============ REDE VIEW ============ -->
  <section id="redeView" class="hidden">
    <div class="rv-head">
      <button class="back" onclick="showHub()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>
        Todas as redes
      </button>
      <div class="rv-title">
        <div class="pos" id="rvPos"></div>
        <h2 id="rvName"></h2>
      </div>
    </div>

    <div class="kpis" id="rvKpis"></div>
    <div class="resumo" id="rvResumo"></div>

    <div class="tabs">
      <button class="tab active" data-tab="prod" onclick="setTab('prod')">Produtos</button>
      <button class="tab" data-tab="marca" onclick="setTab('marca')">Marcas</button>
      <button class="tab" data-tab="mes" onclick="setTab('mes')">Por mês</button>
    </div>

    <div class="panel active" id="panel-prod"></div>
    <div class="panel" id="panel-marca"></div>
    <div class="panel" id="panel-mes"></div>
  </section>
</div>

<script src="dados/redes.js"></script>
<script>
/* ================= helpers ================= */
const BRL0 = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const BRL2 = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const NUM  = new Intl.NumberFormat('pt-BR');
const money = v => BRL0.format(v||0);
const sum = a => a.reduce((s,x)=>s+(x||0),0);
const MES_LBL = m => { const [y,mm]=m.split('-'); return ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+mm-1]+'/'+y.slice(2); };

/* Tendência: média dos últimos 3 meses vs 3 meses anteriores (%). */
function trend(serie){
  const n=serie.length; if(n<6) return null;
  const recent=sum(serie.slice(n-3))/3, prev=sum(serie.slice(n-6,n-3))/3;
  if(prev<=0) return recent>0?{pct:100,dir:'up'}:{pct:0,dir:'flat'};
  const pct=(recent-prev)/prev*100;
  return {pct, dir: pct>=3?'up':(pct<=-3?'down':'flat')};
}
function trendChip(t){
  if(!t) return '<span class="trend flat">—</span>';
  const arw = t.dir==='up'?'▲':(t.dir==='down'?'▼':'▬');
  const s = (t.pct>0?'+':'')+t.pct.toFixed(0)+'%';
  return `<span class="trend ${t.dir}">${arw} ${s}</span>`;
}

/* ================= modelo ================= */
let DATA=null, MESES=[], REDES=[];
function buildModel(){
  MESES = REDES_RAW.meses;
  REDES = REDES_RAW.redes.map(r=>{
    // série da rede = soma dos produtos
    const serie = MESES.map((_,i)=> sum(r.produtos.map(p=>p.serie[i]||0)));
    const total = sum(serie);
    // marcas
    const bm={};
    r.produtos.forEach(p=>{
      const k=p.marca||'—';
      if(!bm[k]) bm[k]={marca:k, serie:MESES.map(()=>0)};
      p.serie.forEach((v,i)=> bm[k].serie[i]+= v||0);
    });
    const marcas = Object.values(bm).map(m=>({...m,total:sum(m.serie),tr:trend(m.serie)}))
                     .sort((a,b)=>b.total-a.total);
    const produtos = r.produtos.map(p=>({...p,total:sum(p.serie),tr:trend(p.serie)}))
                     .sort((a,b)=>b.total-a.total);
    return {cod:r.cod, nome:r.nome, serie, total, media:total/MESES.length, tr:trend(serie), produtos, marcas};
  }).sort((a,b)=>b.total-a.total);
  document.getElementById('upChip').textContent = 'Atualizado em '+(REDES_RAW.atualizadoEm||'—');
}

/* ================= SVG charts ================= */
function sparkline(serie,color){
  const w=300,h=44,pad=3,mx=Math.max(...serie,1);
  const step=(w-pad*2)/(serie.length-1);
  const pts=serie.map((v,i)=>[pad+i*step, h-pad-(v/mx)*(h-pad*2)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=d+` L${(pad+(serie.length-1)*step).toFixed(1)} ${h-pad} L${pad} ${h-pad} Z`;
  const id='g'+Math.random().toString(36).slice(2,7);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${id})"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}
function barsChart(serie,meses){
  const w=1000,h=380,padL=70,padB=46,padT=20,padR=16;
  const mx=Math.max(...serie,1);
  const iw=w-padL-padR, ih=h-padT-padB;
  const bw=iw/serie.length;
  let bars='',lbls='';
  // gridlines
  let grid='';
  for(let g=0;g<=4;g++){
    const y=padT+ih*(g/4); const val=mx*(1-g/4);
    grid+=`<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#26325a" stroke-width="1"/>`;
    grid+=`<text x="${padL-10}" y="${y+4}" text-anchor="end" font-size="12" fill="#93a2c9">${money(val)}</text>`;
  }
  serie.forEach((v,i)=>{
    const bh=(v/mx)*ih, x=padL+i*bw+bw*0.16, bwr=bw*0.68, y=padT+ih-bh;
    const last=i>=serie.length-3;
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bwr.toFixed(1)}" height="${bh.toFixed(1)}" rx="4" fill="${last?'#4d7cff':'#33477e'}"><title>${MES_LBL(meses[i])}: ${BRL2.format(v)}</title></rect>`;
    lbls+=`<text x="${(padL+i*bw+bw/2).toFixed(1)}" y="${h-padB+22}" text-anchor="middle" font-size="12" fill="#93a2c9">${MES_LBL(meses[i])}</text>`;
  });
  return `<svg class="bars" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">${grid}${bars}${lbls}</svg>`;
}

/* ================= HUB ================= */
function renderHub(filter=''){
  const f=filter.trim().toLowerCase();
  const list=REDES.filter(r=>!f||r.nome.toLowerCase().includes(f));
  const grid=document.getElementById('hubGrid');
  grid.innerHTML = list.length? list.map(r=>{
    const gpos=REDES.indexOf(r)+1;
    const col=r.tr? (r.tr.dir==='up'?'#25d366':(r.tr.dir==='down'?'#ff5a5f':'#9aa8cc')):'#9aa8cc';
    return `<div class="rede-card" onclick="openRede('${r.cod}')">
      <div class="rank">${gpos}</div>
      <div style="display:flex;align-items:center;gap:12px">
        <span class="pos ${gpos<=3?'top':''}">${gpos}º</span>
        <h3>${r.nome}</h3>
      </div>
      <div class="mm">Média mensal <b>${money(r.media)}</b></div>
      ${sparkline(r.serie,col)}
      <div style="display:flex;justify-content:space-between;align-items:center">
        ${trendChip(r.tr)}
        <span style="color:var(--mut);font-size:13px">${r.produtos.length} produtos</span>
      </div>
    </div>`;
  }).join('') : '<div class="empty">Nenhuma rede encontrada.</div>';

  // faixa de stats
  const tot=sum(REDES.map(r=>r.total));
  const cresc=REDES.filter(r=>r.tr&&r.tr.dir==='up').length;
  const caind=REDES.filter(r=>r.tr&&r.tr.dir==='down').length;
  document.getElementById('hubStats').innerHTML=`
    <div class="sstat"><div class="k">Redes ativas</div><div class="v">${REDES.length}</div></div>
    <div class="sstat"><div class="k">Faturamento 12 meses</div><div class="v">${money(tot)}</div></div>
    <div class="sstat"><div class="k" style="color:var(--up)">Em crescimento</div><div class="v" style="color:var(--up)">${cresc}</div></div>
    <div class="sstat"><div class="k" style="color:var(--down)">Em queda</div><div class="v" style="color:var(--down)">${caind}</div></div>`;
}

/* ================= REDE VIEW ================= */
let CUR=null;
function openRede(cod){
  CUR=REDES.find(r=>r.cod===cod); if(!CUR)return;
  const pos=REDES.indexOf(CUR)+1;
  document.getElementById('hub').classList.add('hidden');
  document.getElementById('redeView').classList.remove('hidden');
  document.getElementById('rvPos').textContent=`${pos}º lugar na curva · ${CUR.produtos.length} produtos · ${CUR.marcas.length} marcas`;
  document.getElementById('rvName').textContent=CUR.nome;

  document.getElementById('rvKpis').innerHTML=`
    <div class="kpi"><div class="k">Média mensal</div><div class="v">${money(CUR.media)}</div></div>
    <div class="kpi"><div class="k">Faturamento 12 meses</div><div class="v">${money(CUR.total)}</div></div>
    <div class="kpi"><div class="k">Tendência (3m x 3m)</div><div class="v small">${trendChip(CUR.tr)}</div></div>`;

  renderResumo();
  setTab('prod');
  window.scrollTo(0,0);
}
function showHub(){
  document.getElementById('redeView').classList.add('hidden');
  document.getElementById('hub').classList.remove('hidden');
  window.scrollTo(0,0);
}

function renderResumo(){
  const r=CUR, t=r.tr;
  const dirTxt = !t?'estável': t.dir==='up'?`<span class="hl-up">crescendo ${t.pct.toFixed(0)}%</span>`
                : t.dir==='down'?`<span class="hl-down">caindo ${Math.abs(t.pct).toFixed(0)}%</span>`
                : 'estável (variação pequena)';
  const topP = r.produtos.slice(0,3);
  const quedas = r.produtos.filter(p=>p.tr&&p.tr.dir==='down'&&p.total>0).slice(0,3);
  const subindo = r.produtos.filter(p=>p.tr&&p.tr.dir==='up'&&p.total>0).slice(0,3);
  const marcaTop = r.marcas[0];

  let li='';
  li+=`<li><span class="dot" style="background:var(--acc)"></span> Marca mais forte: <b style="margin-left:4px">${marcaTop?marcaTop.marca:'—'}</b> — ${marcaTop?money(marcaTop.total):''} em 12 meses ${marcaTop?trendChip(marcaTop.tr):''}</li>`;
  if(subindo.length) li+=`<li><span class="dot" style="background:var(--up)"></span> Em alta: ${subindo.map(p=>`${p.desc} (${p.tr.pct.toFixed(0)}%)`).join(' · ')}</li>`;
  if(quedas.length) li+=`<li><span class="dot" style="background:var(--down)"></span> Atenção — caindo: ${quedas.map(p=>`${p.desc} (${p.tr.pct.toFixed(0)}%)`).join(' · ')}</li>`;

  document.getElementById('rvResumo').innerHTML=`
    <span class="big">Como está a rede ${r.nome}</span>
    A rede está ${dirTxt} comparando os <b>últimos 3 meses</b> com os 3 anteriores, com média de <b>${money(r.media)}</b> por mês.
    O carro-chefe é <b>${topP[0]?topP[0].desc:'—'}</b>${topP[1]?`, seguido de ${topP[1].desc}`:''}.
    <ul>${li}</ul>`;
}

/* tabs */
function setTab(tab){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+tab).classList.add('active');
  if(tab==='prod') renderProdutos();
  if(tab==='marca') renderMarcas();
  if(tab==='mes') renderMes();
}

function renderProdutos(){
  const el=document.getElementById('panel-prod');
  el.innerHTML='<div class="rows">'+CUR.produtos.map((p,i)=>{
    const col=p.tr?(p.tr.dir==='up'?'#25d366':(p.tr.dir==='down'?'#ff5a5f':'#9aa8cc')):'#9aa8cc';
    return `<div class="row" onclick="toggleDetail(this,'prod',${i})">
      <div class="idx">${i+1}</div>
      <div class="nm">${p.desc}<small>${p.marca||'—'} · cód ${p.cod}</small></div>
      <div class="mini">${sparkline(p.serie,col)}</div>
      <div class="tr">${trendChip(p.tr)}</div>
      <div class="val">${money(p.total)}<small>12 meses</small></div>
    </div>`;
  }).join('')+'</div>';
}
function renderMarcas(){
  const el=document.getElementById('panel-marca');
  el.innerHTML='<div class="rows">'+CUR.marcas.map((m,i)=>{
    const col=m.tr?(m.tr.dir==='up'?'#25d366':(m.tr.dir==='down'?'#ff5a5f':'#9aa8cc')):'#9aa8cc';
    return `<div class="row" onclick="toggleDetail(this,'marca',${i})">
      <div class="idx">${i+1}</div>
      <div class="nm">${m.marca}<small>${CUR.produtos.filter(p=>(p.marca||'—')===m.marca).length} produtos</small></div>
      <div class="mini">${sparkline(m.serie,col)}</div>
      <div class="tr">${trendChip(m.tr)}</div>
      <div class="val">${money(m.total)}<small>12 meses</small></div>
    </div>`;
  }).join('')+'</div>';
}
function toggleDetail(rowEl,type,i){
  const ex=rowEl.nextElementSibling;
  if(ex&&ex.classList.contains('detail')){ex.remove();return;}
  document.querySelectorAll('.detail').forEach(d=>d.remove());
  const obj = type==='prod'?CUR.produtos[i]:CUR.marcas[i];
  const name = type==='prod'?obj.desc:obj.marca;
  const div=document.createElement('div');
  div.className='detail';
  div.innerHTML=`<div class="dt"><div><h5>${name}</h5>
      <div style="color:var(--mut);font-size:14px;margin-top:2px">Evolução mensal · ${money(obj.total)} em 12 meses · ${trendChip(obj.tr)}</div></div>
      <button class="close" onclick="this.closest('.detail').remove()">×</button></div>
      ${barsChart(obj.serie,MESES)}`;
  rowEl.after(div);
  div.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function renderMes(){
  const el=document.getElementById('panel-mes');
  const best=MESES[CUR.serie.indexOf(Math.max(...CUR.serie))];
  const worst=MESES[CUR.serie.indexOf(Math.min(...CUR.serie))];
  el.innerHTML=`<div class="chartbox">
    <h4>Faturamento por mês — ${CUR.nome}</h4>
    <div class="cs">Últimos ${MESES.length} meses · melhor mês: ${MES_LBL(best)} · pior mês: ${MES_LBL(worst)}</div>
    ${barsChart(CUR.serie,MESES)}
  </div>`;
}

/* ================= init ================= */
buildModel();
renderHub();
document.getElementById('q').addEventListener('input',e=>renderHub(e.target.value));
</script>
</body>
</html>
